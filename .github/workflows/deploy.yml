name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; a newer push waits for the current one.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: 761e3fc93a48bd088e8716941e0e3b10
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # Public by design: it ends up in a <meta> tag on every page.
          PUBLIC_WEBMCP_ORIGIN_TRIAL_TOKEN: ${{ vars.PUBLIC_WEBMCP_ORIGIN_TRIAL_TOKEN }}

      # Runs after the build (so a broken build never touches the database) and
      # before deploy (so new code never goes live ahead of its schema).
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply guestbook --remote

      - name: Deploy
        run: npx wrangler deploy
